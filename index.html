<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Promptee</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
html{font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;color:#1d1d1f;background:#f5f5f7;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
.header{height:48px;min-height:48px;background:#1a1a1e;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.06)}
.header h1{font-size:14px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.02em}
.header .badge{font-size:11px;color:rgba(255,255,255,.45);background:rgba(255,255,255,.08);padding:3px 10px;border-radius:6px}
.header-btn{background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:12px;transition:.2s}
.header-btn:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.1)}
 .workspace{flex:1;display:flex;min-height:0}
.panel{overflow:hidden;display:flex;flex-direction:column}
 .panel-left{overflow:visible;flex:0 0 23%;background:#1a1a1e;border-right:1px solid rgba(255,255,255,.06)}
 .panel-center{flex:0 0 54%;background:#fff}
 .panel-right{flex:0 0 23%;background:#f5f5f7;border-left:1px solid #e8e8ed}
.panel-header{height:44px;min-height:44px;display:flex;align-items:center;padding:0 20px;font-size:13px;font-weight:600;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.06)}
.panel-left .panel-header{color:rgba(255,255,255,.7)}
.panel-center .panel-header{color:#6e6e73;border-bottom-color:#e8e8ed}
.panel-right .panel-header{color:#6e6e73;border-bottom-color:#e8e8ed}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:2px}
.panel-left .panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
.section{margin-bottom:20px}
.section:last-child{margin-bottom:0}
.section-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.field-dark{display:flex;flex-direction:column;gap:5px}
.field-dark label{font-size:12px;font-weight:500;color:rgba(255,255,255,.6)}
.field-dark input{padding:8px 12px;border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:13px;font-family:inherit;background:rgba(255,255,255,.06);color:rgba(255,255,255,.9);transition:all .2s;outline:none;width:100%}
.field-dark input:focus{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08);box-shadow:0 0 0 2px rgba(0,113,227,.3)}
.field-dark input::placeholder{color:rgba(255,255,255,.25)}
.field-dark .hint{font-size:11px;color:rgba(255,255,255,.35);line-height:1.4}
.field-dark .hint strong{color:rgba(255,255,255,.5)}
.toggle-row-dark{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.toggle-row-dark label{font-size:12px;font-weight:500;color:rgba(255,255,255,.6);cursor:pointer}
.toggle-dark{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
 .toggle-dark input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;z-index:1}
.toggle-dark .slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.15);border-radius:20px;transition:.25s}
.toggle-dark .slider::before{content:"";position:absolute;height:16px;width:16px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle-dark input:checked+.slider{background:#34c759}
.toggle-dark input:checked+.slider::before{transform:translateX(16px)}
.btn-gen{width:100%;padding:10px;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.btn-gen.primary{background:#0071e3;color:#fff}
.btn-gen.primary:hover{background:#0077ed;color:#fff}
.btn-gen.primary:active{background:#006edb}
.btn-gen.primary:disabled{background:rgba(0,113,227,.35);cursor:not-allowed;color:rgba(255,255,255,.4)}
.tpl-btn{padding:4px 14px;border-radius:6px;font-size:11px;font-weight:500;font-family:inherit;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;transition:all .2s}.tpl-btn:hover{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.7)}.tpl-btn.active{background:#34c759;border-color:#34c759;color:#fff}.collapsible-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0}
.collapsible-arrow{color:rgba(255,255,255,.25);transition:transform .25s;font-size:10px;line-height:1}
.collapsible-arrow.open{transform:rotate(90deg)}
.collapsible-body{overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s;opacity:0}
.collapsible-body.open{max-height:600px;opacity:1}
.collapsible-body-inner{padding-top:8px}
.dropzone{position:relative;border:2px dashed #d2d2d7;border-radius:14px;padding:40px 20px;text-align:center;transition:all .25s;cursor:pointer;background:#fafafa;margin-bottom:16px}
.dropzone:hover,.dropzone.drag-over{border-color:#0071e3;background:#f0f7ff}
.dropzone-icon{margin-bottom:10px;color:#c7c7cc}
.dropzone h3{font-size:15px;font-weight:500;color:#1d1d1f;margin-bottom:2px}
.dropzone p{font-size:12px;color:#8e8e93}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.image-grid .img-item{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#f0f0f0;border:1px solid #e8e8ed}
.image-grid .img-item img{width:100%;height:100%;object-fit:cover;display:block}
.image-grid .img-item .remove-btn{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;backdrop-filter:blur(4px)}
.image-grid .img-item:hover .remove-btn{opacity:1}
.image-grid .img-item .filename{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);color:#fff;font-size:9px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results-wrapper{flex:1;overflow:auto;min-height:0}
.results-wrapper::-webkit-scrollbar{width:4px}
.results-wrapper::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:2px}
.results-table{width:100%;border-collapse:collapse;font-size:12px}
.results-table th{background:#f5f5f7;color:#6e6e73;font-weight:600;padding:8px 12px;text-align:left;border-bottom:1px solid #e8e8ed;font-size:11px;letter-spacing:.03em;position:sticky;top:0;z-index:1}
.results-table td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:top;line-height:1.4}
.results-table .col-index{width:28px;text-align:center;color:#c7c7cc;font-size:11px}
.results-table .col-preview{width:44px;padding:6px 8px}
.results-table .col-preview img{width:36px;height:36px;border-radius:6px;object-fit:cover;display:block;border:1px solid #e8e8ed}
.results-table .col-result{min-width:160px;max-width:260px}
.results-table .col-result pre{font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-family:-apple-system,Menlo,Consolas,monospace;background:#fafafa;padding:6px 8px;border-radius:6px;max-height:180px;overflow-y:auto;margin:0}
.results-table .col-status{width:56px;text-align:center}
.status-badge{display:inline-block;padding:1px 8px;border-radius:8px;font-size:10px;font-weight:500}
.status-badge.done{background:#e8f8ee;color:#1a7d36}
.status-badge.error{background:#fde8e8;color:#c41e3a}
.status-badge.pending{background:#f0f0f0;color:#8e8e93}
.status-badge.processing{background:#f0f7ff;color:#0071e3}.btn-gen.danger{background:#ff3b30;color:#fff}.btn-gen.danger:hover{background:#e6352b}.btn-gen.danger:active{background:#cc2e24}.btn-gen-group{display:flex;gap:6px;margin-top:4px}.btn-gen-group .btn-gen{margin-top:0}.field-dark select{padding:8px 12px;border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:13px;font-family:inherit;background:rgba(255,255,255,.06);color:rgba(255,255,255,.9);outline:none;width:100%;cursor:pointer}.status-badge.cancelled{background:#f0f0f0;color:#8e8e93}
.right-footer{padding:12px 20px;border-top:1px solid #e8e8ed;background:#fff;flex-shrink:0}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.progress-bar-container{flex:1;height:3px;background:#e8e8ed;border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:#0071e3;border-radius:2px;transition:width .3s ease;width:0}
.progress-info{font-size:11px;color:#8e8e93;white-space:nowrap}
.export-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:500;font-family:inherit;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-sm.outline{background:transparent;color:#0071e3;border:1px solid #0071e3}
.btn-sm.outline:hover{background:#f0f7ff}
.btn-sm.secondary{background:#e8e8ed;color:#1d1d1f}
.btn-sm.secondary:hover{background:#dcdce1}
.right-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;color:#c7c7cc;padding:40px}
.right-empty h4{font-size:14px;font-weight:500;color:#8e8e93;margin-bottom:2px}
.right-empty p{font-size:12px;color:#c7c7cc}
#toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%)translateY(80px);background:#1d1d1f;color:rgba(255,255,255,.9);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:999}
#toast.show{opacity:1;transform:translateX(-50%)translateY(0)}
 @media(max-width:768px){.workspace{flex-direction:column}.panel-left,.panel-center,.panel-right{width:100%;min-width:0;border:none}.panel-left{border-bottom:1px solid #e8e8ed}.panel-right{border-top:1px solid #e8e8ed}}
.count-badge{font-size:11px;color:#8e8e93;margin-left:8px;font-weight:400}.copy-btn{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06);color:#8e8e93;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;opacity:0;z-index:2}.results-table td:hover .copy-btn{opacity:1}.copy-btn:hover{background:rgba(0,0,0,.08);color:#1d1d1f}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;padding:20px}.modal-card{background:#fff;border-radius:16px;width:90%;max-width:800px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalIn .25s ease}@keyframes modalIn{from{opacity:0;transform:scale(.95)translateY(10px)}to{opacity:1;transform:scale(1)translateY(0)}}.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e8e8ed;flex-shrink:0}.modal-header .title{font-size:14px;font-weight:600;color:#1d1d1f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px}.modal-actions{display:flex;gap:6px;flex-shrink:0}.modal-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:500;font-family:inherit;border:none;cursor:pointer;transition:all .2s}.modal-btn.primary{background:#0071e3;color:#fff}.modal-btn.primary:hover{background:#0077ed}.modal-btn.ghost{background:transparent;color:#8e8e93}.modal-btn.ghost:hover{background:rgba(0,0,0,.06);color:#1d1d1f}.modal-body{flex:1;overflow-y:auto;padding:20px;font-size:13px;line-height:1.7;color:#1d1d1f;white-space:pre-wrap;word-break:break-word;font-family:-apple-system,Menlo,Consolas,monospace}.modal-body::-webkit-scrollbar{width:4px}.modal-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:2px}
</style></head><body>
<header class="header"><div style="display:flex;align-items:center;gap:16px"><h1>Promptee</h1><span class="badge">火山方舟 ARK</span></div><div class="header-actions"><button class="header-btn" id="clearAllBtn">清空</button></div></header>
<div class="workspace">
<aside class="panel panel-left"><div class="panel-header">生成词设置</div><div class="panel-body">
<div class="section"><div class="section-label">模型选择</div><select id="modelSelect" style="width:100%;padding:8px 12px;border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:13px;font-family:inherit;background:rgba(255,255,255,.06);color:rgba(255,255,255,.9);outline:none;cursor:pointer"><option value="doubao-seed-2.1-turbo">Seed2.1 Turbo</option><option value="doubao-vision-pro-32k">Doubao-vision-pro-32k</option><option value="doubao-seed-2.1-pro">Doubao Seed 2.1 Pro</option></select></div>
<div class="section"><div class="section-label">提示词模板</div><div style="display:flex;gap:6px;margin-bottom:10px"><button class="tpl-btn" data-tpl="coat" id="tplCoat">上衣</button><button class="tpl-btn" data-tpl="bottoms" id="tplBottoms">下装</button><button class="tpl-btn" data-tpl="shoes" id="tplShoes">鞋类</button><button class="tpl-btn" data-tpl="fullbody" id="tplFullBody">全身</button><button class="tpl-btn" data-tpl="fullbodyShoes" id="tplFullBodyShoes">全身鞋</button><button class="tpl-btn" data-tpl="singleShoe" id="tplSingleShoe">单鞋</button><button class="tpl-btn active" data-tpl="custom" id="tplCustom">自定义</button></div><div id="genWordSection"><div class="field-dark"><input id="genWord" value="上衣：图中的上衣" placeholder="输入产品描述" /><span class="hint">将替换到提示词模板的产品描述位置</span></div></div><textarea id="promptPreview" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 12px;font-size:11px;line-height:1.6;color:rgba(255,255,255,.9);width:100%;resize:vertical;min-height:100px;font-family:inherit;white-space:pre-wrap;word-break:break-word"></textarea></div>
<div class="section" style="padding-top:4px"><button class="btn-gen primary" id="startBtn" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> 开始生成</button></div>
<div class="section" style="margin-bottom:0;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)">
<div class="collapsible-header" id="apiToggle"><span class="section-label" style="cursor:pointer">API 配置</span><span class="collapsible-arrow" id="apiArrow">›</span></div>
<div class="collapsible-body" id="apiBody"><div class="collapsible-body-inner">
<div class="field-dark" style="margin-bottom:10px"><label>API 地址</label><input id="apiEndpoint" value="https://ark.cn-beijing.volces.com/api/v3/chat/completions" /></div>
<div class="field-dark" style="margin-bottom:10px"><label>API Key</label><input id="apiKey" type="password" placeholder="输入 ARK_API_KEY" /><span class="hint">火山方舟的 API Key</span></div>
<div class="field-dark" style="margin-bottom:10px"><label>推理接入点 ID</label><input id="modelName" placeholder="ep-xxxxx" /><span class="hint">禁止使用原始模型名，请在方舟后台为当前模型创建推理接入点后使用 ep-xxx ID</span></div>
<div class="toggle-row-dark"><label for="streamToggleDark">流式输出</label><span class="toggle-dark"><input type="checkbox" id="streamToggleDark" /><span class="slider"></span></span></div><div class="toggle-row-dark"><label for="concurrencyLimit">并发数</label><select id="concurrencyLimit" style="width:56px;padding:4px 6px;border:1px solid rgba(255,255,255,.12);border-radius:6px;font-size:12px;font-family:inherit;background:rgba(255,255,255,.06);color:rgba(255,255,255,.9);outline:none;cursor:pointer"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
<div class="toggle-row-dark"><label for="compressToggle">图片压缩</label><span class="toggle-dark"><input type="checkbox" id="compressToggle" checked /><span class="slider"></span></span></div>
<div style="padding-left:4px" id="compressConfig"><div style="display:flex;align-items:center;gap:8px;padding:4px 0"><span style="font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap">最大边长</span><select id="maxDimension" style="flex:1;padding:4px 6px;border:1px solid rgba(255,255,255,.12);border-radius:6px;font-size:11px;font-family:inherit;background:rgba(255,255,255,.06);color:rgba(255,255,255,.9);outline:none;cursor:pointer"><option value="768">768px</option><option value="1024" selected>1024px</option><option value="1536">1536px</option><option value="2048">2048px</option></select></div></div>
</div></div></div></div></aside>
<main class="panel panel-center"><div class="panel-header">上传图片<span class="count-badge" id="imgCount"></span></div><div class="panel-body" style="display:flex;flex-direction:column">
<div class="dropzone" id="dropzone"><div class="dropzone-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
<h3>拖入图片或点击选择</h3><p>JPG / PNG / WebP  ·  支持批量</p><input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple /></div>
<div class="image-grid" id="imageGrid"></div></div></main>
<aside class="panel panel-right"><div class="panel-header">生成结果<span class="count-badge" id="resultCount"></span></div>
<div class="results-wrapper" id="resultsWrapper"><div class="right-empty" id="emptyResults"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
<h4>暂无结果</h4><p>上传图片后点击“开始生成”</p></div>
<table class="results-table" id="resultsTable" style="display:none"><thead><tr><th class="col-index">#</th><th class="col-preview"></th><th>文件名</th><th class="col-result">结果</th><th class="col-status">状态</th></tr></thead><tbody id="resultsBody"></tbody></table></div>
<div class="right-footer" id="rightFooter" style="display:none">
<div class="progress-row" id="progressRow"><div class="progress-bar-container"><div class="progress-bar-fill" id="progressFill"></div></div><span class="progress-info" id="progressInfo"></span></div><div class="btn-gen-group" id="cancelBtnGroup" style="display:none"><button class="btn-gen danger" id="cancelBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 停止</button></div><div class="export-actions"><button class="btn-sm outline" id="exportCsvBtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> CSV</button>
<button class="btn-sm outline" id="exportExcelBtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Excel</button>
<button class="btn-sm secondary" id="clearResultsBtn">清空</button></div></div></aside></div>
<div id="toast"></div>
<textarea id="coatPromptData" style="display:none"># 任务目标
作为 AI 图像重建专家，分析输入图片并输出【完整中文 JSON】，用于后续 AI 换装。忽略原图中的上衣，仅依据其余元素分析，最大程度确保换装后的人物、场景、镜头和视觉一致，并**隐性优化人物身材比例**。

# 核心限制
1. 仅输出合法 JSON 源码，禁止任何 Markdown 包裹（如 ```json）、解释或注释。

function hf(files){
  var al=["image/jpeg","image/png","image/webp"];
  var ad=0;
  for(var fi=0;fi<files.length;fi++){
    var f=files[fi];
    if(!al.includes(f.type))continue;
    var dup=false;
    for(var si=0;si<state.images.length;si++){if(state.images[si].file.name===f.name&&state.images[si].file.size===f.size){dup=true;break;}}
    if(dup)continue;
    var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var r=new FileReader();
    (function(cid,cf,cn){r.onload=function(ev){processImage(ev,cid,cf,cn);};})(id,f,f.name);
    r.readAsDataURL(f);ad++;
  }
  if(ad)st("已添加 "+ad+" 张图片");
}

function processImage(ev,cid,cf,cn){
  var du=ev.target.result;
  if(!document.getElementById("compressToggle").checked){state.images.push({id:cid,file:cf,dataUrl:du,name:cn});renderGrid();ui();return;}
  var m=parseInt(document.getElementById("maxDimension").value)||1024;
  var img=new Image();
  img.onload=function(){
    var w=img.width,h=img.height;
    if(m>0&&(w>m||h>m)){var r=Math.min(m/w,m/h);w=Math.round(w*r);h=Math.round(h*r);}
    var c=document.createElement("canvas");c.width=w;c.height=h;

  };

}

      if(us)return await rs(resp);
      var data=await resp.json();
      var cnt=data.choices?.[0]?.message?.content;
      if(!cnt)throw new Error("API 返回异常");return cnt;
    }catch(err){
      clearTimeout(t);
      activeControllers=activeControllers.filter(function(ac){return ac!==c;});
      if(cancelRequested)throw new Error("已取消");
      if(err.name==="AbortError"){le=new Error("请求超时（"+to/1000+"s）");continue;}
      if(err.message&&(err.message.includes("鉴权")||err.message.includes("权限")||err.message.includes("推理接入点")))throw err;
      le=err;
    }
  }
  throw new Error("当前模型["+cfg.label+"]请求失败（已重试 "+RETRY_CONFIG.maxRetries+" 次）: "+(le?.message||"未知"));
}
async function rs(resp){
  var r=resp.body.getReader(),d=new TextDecoder();
  var buf="",full="";
  while(true){var res=await r.read();if(res.done)break;buf+=d.decode(res.value,{stream:true});var ls=buf.split("\n");buf=ls.pop()||"";for(var li=0;li<ls.length;li++){var tr=ls[li].trim();if(!tr||!tr.startsWith("data:"))continue;var dt=tr.slice(5).trim();if(dt==="[DONE]")break;try{var p=JSON.parse(dt);full+=p.choices?.[0]?.delta?.content||"";}catch(e){}}}
  return full;
}

async function startGen(){
  if(state.processing)return;
  var gw=genWordInput.value.trim();if(!gw){st("请输入生成词");genWordInput.focus();return;}
  if(!apiKey.value.trim()||!apiEndpoint.value.trim()||!modelName.value.trim()){st("请先完成 API 配置");apiBody.classList.add("open");apiArrow.classList.add("open");return;}
  state.processing=true;cancelRequested=false;(document.getElementById("cancelBtnGroup")||{style:{}}).style.display="block";state.results=[];
  for(var ii=0;ii<state.images.length;ii++){state.results.push({id:state.images[ii].id,fileName:state.images[ii].name,dataUrl:state.images[ii].dataUrl,result:"",status:"pending"});}
  renderResults();rightFooter.style.display="block";updP(0,state.images.length,"准备中\u2026");
  var pt=buildPrompt(gw),us=streamToggle.checked,total=state.images.length;
  var done=0,he=false,cc=parseInt(document.getElementById("concurrencyLimit").value)||2;
  var queue=[];for(var qi=0;qi<total;qi++){queue.push(qi);}
  async function processItem(idx){
    if(cancelRequested)return;
    var img=state.images[idx];var ri=-1;
    for(var rii=0;rii<state.results.length;rii++){if(state.results[rii].id===img.id){ri=rii;break;}}
    if(ri===-1)return;
    state.results[ri].status="processing";rSI(ri);
    updP(done,total,"分析第 "+(idx+1)+"/"+total+" 张");
    try{
      var result=await callAPI(img.dataUrl,pt,us);
      if(cancelRequested)return;
      state.results[ri].result=result;state.results[ri].status="done";
    }catch(err){
      if(err.message==="已取消")return;
      state.results[ri].result=err.message;state.results[ri].status="error";he=true;
    }
    rSI(ri);
    if(!cancelRequested){done++;updP(done,total,done+"/"+total+" 完成");}
  }
  async function runner(){
    var workers=[];
    for(var wi=0;wi<cc&&wi<queue.length;wi++){
      workers.push((async function(){while(queue.length>0&&!cancelRequested){var item=queue.shift();if(item!==undefined)await processItem(item);}})());
    }
    await Promise.all(workers);
  }
  await runner();
  activeControllers.forEach(function(ac){try{ac.abort();}catch(e){}});activeControllers=[];state.processing=false;cancelRequested=false;(document.getElementById("cancelBtnGroup")||{style:{}}).style.display="none";ui();
  if(!he&&!cancelRequested){updP(done,total,"全部完成");st("全部生成完成！");}
  else if(cancelRequested){state.results.forEach(function(r,ri){if(r.status==="pending"){state.results[ri].status="cancelled";rSI(ri);}});updP(done,total,"已取消");st("已取消");}
  else{updP(done,total,"处理完成（部分失败）");st("部分图片生成失败");}
}

startBtn.addEventListener("click",startGen);function cancelGeneration(){if(!state.processing)return;cancelRequested=true;activeControllers.forEach(function(ac){try{ac.abort();}catch(e){}});activeControllers=[];(document.getElementById("cancelBtnGroup")||{style:{}}).style.display="none";}(document.getElementById("cancelBtn")||document.createElement("div")).addEventListener("click",cancelGeneration);

function updP(d,t,s){var p=t>0?(d/t)*100:0;progressFill.style.width=Math.min(p,100)+"%";progressInfo.textContent=s||(d+"/"+t);}
function renderResults(){
  if(state.results.length){emptyResults.style.display="none";resultsTable.style.display="";var h="";for(var i=0;i<state.results.length;i++){h+=rR(state.results[i],i);}resultsBody.innerHTML=h;}
  else{emptyResults.style.display="";resultsTable.style.display="none";}ui();if(!state.results.length)rightFooter.style.display="none";
}
function rSI(i){var r=state.results[i];var row=resultsBody.querySelector('tr[data-id="'+r.id+'"]');if(row)row.outerHTML=rR(r,i);}
function rR(r,i){var sm={pending:"等待",processing:"处理中",done:"完成",error:"失败"};var pv='<img src="'+r.dataUrl+'" alt="'+eh(r.fileName)+'" />';var rd='';if(r.result){rd='<div style="position:relative"><pre style="cursor:pointer" onclick="showFullView('+i+')">'+eh(r.result)+'</pre><button class="copy-btn" onclick="copyResult('+i+')" title="复制"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div>';}else{rd='<span style="color:#c7c7cc;font-size:11px">等待处理\u2026</span>';}return '<tr data-id="'+r.id+'"><td class="col-index">'+(i+1)+'</td><td class="col-preview">'+pv+'</td><td>'+eh(r.fileName)+'</td><td class="col-result">'+rd+'</td><td class="col-status"><span class="status-badge '+r.status+'">'+(sm[r.status]||r.status)+'</span></td></tr>';}
function copyResult(i){var r=state.results[i];if(!r||!r.result)return;navigator.clipboard.writeText(r.result).then(function(){st("已复制");},function(){st("复制失败");});}function showFullView(i){var r=state.results[i];if(!r||!r.result)return;document.getElementById("modalTitle").textContent=r.fileName;document.getElementById("modalBody").textContent=r.result;document.getElementById("modalOverlay").style.display="flex";}function closeModal(){document.getElementById("modalOverlay").style.display="none";}function copyModal(){var t=document.getElementById("modalBody").textContent;navigator.clipboard.writeText(t).then(function(){st("已复制");},function(){st("复制失败");});}function eh(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function exportCSV(){
  var a=[];for(var i=0;i<state.results.length;i++){if(state.results[i].status==="done"||state.results[i].status==="error")a.push(state.results[i]);}if(!a.length){st("没有可导出的结果");return;}
  var rows=[["序号","文件名","生成结果","状态"]];
  for(var i=0;i<a.length;i++){rows.push([i+1,a[i].fileName,a[i].result,a[i].status==="done"?"完成":"失败"]);}
  var csv="";for(var i=0;i<rows.length;i++){if(i>0)csv+="\n";for(var j=0;j<rows[i].length;j++){if(j>0)csv+=",";var c=rows[i][j];if(typeof c==="string"&&(c.includes(",")||c.includes('"')||c.includes("\n")))csv+='"'+c.replace(/"/g,'""')+'"';else csv+=c;}}
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});var url=URL.createObjectURL(blob);var aE=document.createElement("a");aE.href=url;aE.download="生成结果_"+fd()+".csv";document.body.appendChild(aE);aE.click();document.body.removeChild(aE);URL.revokeObjectURL(url);st("CSV 已导出");
}
exportCsvBtn.addEventListener("click",exportCSV);
function exportExcel(){
  if(typeof XLSX==="undefined"){st("XLSX 库尚未加载");return;}
  var a=[];for(var i=0;i<state.results.length;i++){if(state.results[i].status==="done"||state.results[i].status==="error")a.push(state.results[i]);}if(!a.length){st("没有可导出的结果");return;}
  var data=[];for(var i=0;i<a.length;i++){var o={};o["序号"]=i+1;o["文件名"]=a[i].fileName;o["生成结果"]=a[i].result;o["状态"]=a[i].status==="done"?"完成":"失败";data.push(o);}
  var wb=XLSX.utils.book_new();var ws=XLSX.utils.json_to_sheet(data);ws["!cols"]=[{wch:6},{wch:30},{wch:80},{wch:10}];XLSX.utils.book_append_sheet(wb,ws,"生成结果");XLSX.writeFile(wb,"生成结果_"+fd()+".xlsx");st("Excel 已导出");
}
exportExcelBtn.addEventListener("click",exportExcel);
clearResultsBtn.addEventListener("click",function(){if(state.processing)return;state.results=[];renderResults();rightFooter.style.display="none";updP(0,0,"");st("结果已清空");});

function fd(){var d=new Date();function pad(n){return String(n).padStart(2,"0");}return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}
